name: Technician GUI checks
on:
  push:
    branches: [feature/figma-gui]
  pull_request:
    paths: ['figma-gui/**', '.github/workflows/figma-gui.yml']
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: voltesse_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: python -m pip install -r backend/requirements-dev.txt
        working-directory: figma-gui
      - run: python -m pytest -q tests
        working-directory: figma-gui
        env:
          TEST_DATABASE_URL: postgresql://postgres:integration-only@localhost:5432/voltesse_test
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: figma-gui/web/package-lock.json
      - run: npm ci
        working-directory: figma-gui/web
      - run: npm run build
        working-directory: figma-gui/web
